[versions]
agp = "8.10.1"
kotlin = "2.1.21"
coreKtx = "1.16.0"
appcompat = "1.7.0"
material = "1.12.0"
recyclerview = "1.4.0"
anthropic = "3.12.0"
media3 = "1.5.1"
vosk = "0.3.75"
jna = "5.13.0"
playServicesAuth = "21.2.0"
okhttp = "4.12.0"
guava = "33.3.1-android"
mlkitFace = "17.1.0"
ytdl = "0.18.1"
junitJupiter = "5.11.4"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
anthropic-java = { group = "com.anthropic", name = "anthropic-java", version.ref = "anthropic" }
media3-transformer = { group = "androidx.media3", name = "media3-transformer", version.ref = "media3" }
media3-effect = { group = "androidx.media3", name = "media3-effect", version.ref = "media3" }
media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
