name: ClipCraft CI

on:
  push:
    branches: ['**']
    paths: ['clipcraft/**', 'gradle/wrapper/**', '.github/workflows/clipcraft-ci.yml']
  pull_request:
    paths: ['clipcraft/**', 'gradle/wrapper/**', '.github/workflows/clipcraft-ci.yml']

concurrency:
  group: clipcraft-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (clip planning)
        run: ./gradlew -p clipcraft coreTest --stacktrace

      - name: Android lint
        run: ./gradlew -p clipcraft :app:lintDebug --stacktrace

      - name: Build debug APK and release bundle
        # Unsigned; real releases use clipcraft-release.yml.
        run: ./gradlew -p clipcraft :app:assembleDebug :app:bundleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: clipcraft-debug-apk
          path: clipcraft/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipcraft-reports
          path: |
            clipcraft/core/build/reports/
            clipcraft/app/build/reports/
          retention-days: 7
