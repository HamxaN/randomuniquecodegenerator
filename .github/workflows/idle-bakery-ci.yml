name: Idle Bakery CI

on:
  push:
    branches: ['**']
    paths: ['idle-bakery/**', 'gradle/wrapper/**', '.github/workflows/idle-bakery-ci.yml']
  pull_request:
    paths: ['idle-bakery/**', 'gradle/wrapper/**', '.github/workflows/idle-bakery-ci.yml']

concurrency:
  group: idle-bakery-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (game rules)
        run: ./gradlew -p idle-bakery coreTest --stacktrace

      - name: Android lint
        run: ./gradlew -p idle-bakery :app:lintDebug --stacktrace

      - name: Build debug APK and release bundle
        # Uses Google's test ad IDs and is unsigned; real releases use idle-bakery-release.yml.
        run: ./gradlew -p idle-bakery :app:assembleDebug :app:bundleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: idle-bakery-debug-apk
          path: idle-bakery/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idle-bakery-reports
          path: |
            idle-bakery/core/build/reports/
            idle-bakery/app/build/reports/
          retention-days: 7
