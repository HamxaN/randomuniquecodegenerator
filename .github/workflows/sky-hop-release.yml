name: Release Sky Hop to Google Play

on:
  push:
    tags: ['hop-v*']
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track: internal, alpha (closed), beta (open) or production'
        default: internal
        required: true
      status:
        description: 'Release status: draft (roll out by hand in Play Console) or completed'
        default: draft
        required: true

env:
  GODOT_VERSION: '4.6.3'
  PROJECT: sky-hop

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Each app has its own AdMob IDs and signing key, so its secrets are prefixed.
      KEYSTORE_BASE64: ${{ secrets.HOP_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.HOP_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.HOP_KEY_ALIAS }}
      ADMOB_APP_ID: ${{ secrets.HOP_ADMOB_APP_ID }}
      ADMOB_BANNER_ID: ${{ secrets.HOP_ADMOB_BANNER_ID }}
      ADMOB_INTERSTITIAL_ID: ${{ secrets.HOP_ADMOB_INTERSTITIAL_ID }}
      ADMOB_REWARDED_ID: ${{ secrets.HOP_ADMOB_REWARDED_ID }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check required secrets
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS \
                      ADMOB_APP_ID ADMOB_BANNER_ID ADMOB_INTERSTITIAL_ID ADMOB_REWARDED_ID \
                      PLAY_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret for $name (see sky-hop/README.md)"
              missing=1
            fi
          done
          exit $missing

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android-v1

      - name: Install Godot
        run: .github/scripts/godot-install.sh "$GODOT_VERSION"

      - name: Decode signing key
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sky-hop.jks"

      - name: Work out version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/hop-v* ]]; then
            name="${GITHUB_REF_NAME#hop-v}"
          else
            name="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          # Play needs a higher version code for every upload.
          echo "code=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Import, test and add AdMob with the real IDs
        run: |
          .github/scripts/godot-import.sh "$PROJECT"
          godot --headless --path "$PROJECT" -s res://tests/run_tests.gd
          .github/scripts/godot-add-admob.sh "$PROJECT" "$ADMOB_APP_ID" "$ADMOB_BANNER_ID" "$ADMOB_INTERSTITIAL_ID" "$ADMOB_REWARDED_ID"

      - name: Build signed bundle
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/sky-hop.jks
        run: .github/scripts/godot-release-bundle.sh "$PROJECT" "${{ steps.version.outputs.name }}" "${{ steps.version.outputs.code }}" "$PWD/build/sky-hop.aab"

      - name: Upload bundle as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sky-hop-${{ steps.version.outputs.name }}
          path: build/sky-hop.aab

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.hamxanadeem.skyhop
          releaseFiles: build/sky-hop.aab
          track: ${{ inputs.track || 'internal' }}
          status: ${{ inputs.status || 'draft' }}
