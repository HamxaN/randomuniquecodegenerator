name: Release SnapDoc Scanner to Google Play

on:
  push:
    tags: ['snapdoc-v*']
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track: internal, alpha (closed), beta (open) or production'
        default: internal
        required: true
      status:
        description: 'Release status: draft (roll out by hand in Play Console) or completed'
        default: draft
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Each app has its own AdMob IDs and signing key, so its secrets are prefixed.
      KEYSTORE_BASE64: ${{ secrets.SNAPDOC_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.SNAPDOC_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.SNAPDOC_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.SNAPDOC_KEY_PASSWORD }}
      ADMOB_APP_ID: ${{ secrets.SNAPDOC_ADMOB_APP_ID }}
      ADMOB_BANNER_ID: ${{ secrets.SNAPDOC_ADMOB_BANNER_ID }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check required secrets
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD \
                      ADMOB_APP_ID ADMOB_BANNER_ID \
                      PLAY_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret for $name (see snap-doc/README.md)"
              missing=1
            fi
          done
          exit $missing

      - name: Decode signing key
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/snap-doc.jks"

      - name: Work out version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/snapdoc-v* ]]; then
            name="${GITHUB_REF_NAME#snapdoc-v}"
          else
            name="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          # Play needs a higher version code for every upload.
          echo "code=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Test and build signed bundle
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/snap-doc.jks
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew -p snap-doc coreTest :app:lintRelease :app:bundleRelease --stacktrace

      - name: Upload bundle as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: snap-doc-${{ steps.version.outputs.name }}
          path: |
            snap-doc/app/build/outputs/bundle/release/app-release.aab
            snap-doc/app/build/outputs/mapping/release/mapping.txt

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.hamxanadeem.snapdoc
          releaseFiles: snap-doc/app/build/outputs/bundle/release/app-release.aab
          mappingFile: snap-doc/app/build/outputs/mapping/release/mapping.txt
          track: ${{ inputs.track || 'internal' }}
          status: ${{ inputs.status || 'draft' }}
