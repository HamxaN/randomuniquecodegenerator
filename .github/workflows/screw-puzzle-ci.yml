name: Screw Puzzle CI

on:
  push:
    branches: ['**']
    paths: ['screw-puzzle/**', 'gradle/wrapper/**', '.github/workflows/screw-puzzle-ci.yml']
  pull_request:
    paths: ['screw-puzzle/**', 'gradle/wrapper/**', '.github/workflows/screw-puzzle-ci.yml']

concurrency:
  group: screw-puzzle-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (game rules)
        run: ./gradlew -p screw-puzzle coreTest --stacktrace

      - name: Android lint
        run: ./gradlew -p screw-puzzle :app:lintDebug --stacktrace

      - name: Build debug APK and release bundle
        # Uses Google's test ad IDs and is unsigned; real releases use screw-puzzle-release.yml.
        run: ./gradlew -p screw-puzzle :app:assembleDebug :app:bundleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: screw-puzzle-debug-apk
          path: screw-puzzle/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screw-puzzle-reports
          path: |
            screw-puzzle/core/build/reports/
            screw-puzzle/app/build/reports/
          retention-days: 7
