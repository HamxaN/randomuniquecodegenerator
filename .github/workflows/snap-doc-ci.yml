name: SnapDoc Scanner CI

on:
  push:
    branches: ['**']
    paths: ['snap-doc/**', 'gradle/wrapper/**', '.github/workflows/snap-doc-ci.yml']
  pull_request:
    paths: ['snap-doc/**', 'gradle/wrapper/**', '.github/workflows/snap-doc-ci.yml']

concurrency:
  group: snap-doc-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (document logic)
        run: ./gradlew -p snap-doc coreTest --stacktrace

      - name: Android lint
        run: ./gradlew -p snap-doc :app:lintDebug --stacktrace

      - name: Build debug APK and release bundle
        # Uses Google's test ad IDs and is unsigned; real releases use snap-doc-release.yml.
        run: ./gradlew -p snap-doc :app:assembleDebug :app:bundleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: snap-doc-debug-apk
          path: snap-doc/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snap-doc-reports
          path: |
            snap-doc/core/build/reports/
            snap-doc/app/build/reports/
          retention-days: 7
