name: Neon Runner CI

on:
  push:
    branches: ['**']
    paths: ['neon-runner/**', 'gradle/wrapper/**', '.github/workflows/neon-runner-ci.yml']
  pull_request:
    paths: ['neon-runner/**', 'gradle/wrapper/**', '.github/workflows/neon-runner-ci.yml']

concurrency:
  group: neon-runner-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (game rules)
        run: ./gradlew -p neon-runner coreTest --stacktrace

      - name: Android lint
        run: ./gradlew -p neon-runner :app:lintDebug --stacktrace

      - name: Build debug APK and release bundle
        # Uses Google's test ad IDs and is unsigned; real releases use neon-runner-release.yml.
        run: ./gradlew -p neon-runner :app:assembleDebug :app:bundleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: neon-runner-debug-apk
          path: neon-runner/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-runner-reports
          path: |
            neon-runner/core/build/reports/
            neon-runner/app/build/reports/
          retention-days: 7
