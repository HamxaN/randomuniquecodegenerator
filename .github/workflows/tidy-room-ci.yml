name: Tidy Room CI

on:
  push:
    branches: ['**']
    paths: ['tidy-room/**', 'gradle/wrapper/**', '.github/workflows/tidy-room-ci.yml']
  pull_request:
    paths: ['tidy-room/**', 'gradle/wrapper/**', '.github/workflows/tidy-room-ci.yml']

concurrency:
  group: tidy-room-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (game rules)
        run: ./gradlew -p tidy-room coreTest --stacktrace

      - name: Android lint
        run: ./gradlew -p tidy-room :app:lintDebug --stacktrace

      - name: Build debug APK and release bundle
        # Uses Google's test ad IDs and is unsigned; real releases use tidy-room-release.yml.
        run: ./gradlew -p tidy-room :app:assembleDebug :app:bundleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tidy-room-debug-apk
          path: tidy-room/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tidy-room-reports
          path: |
            tidy-room/core/build/reports/
            tidy-room/app/build/reports/
          retention-days: 7
